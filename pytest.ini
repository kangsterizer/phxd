[pytest]
# Discover tests under ``tests/``; keep the production source tree
# (``server/``, ``shared/``, etc.) free of test files so the Docker
# image stays slim.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Make repo-root imports work — production code uses absolute imports
# like ``from shared.HLProtocol import *`` and ``from config import *``,
# both of which need the repo root on sys.path.
pythonpath = .

# Reference clones live under ``reference/`` and contain their own
# language-specific tests we don't want pytest to recurse into.
norecursedirs = reference venv .git textdb files chatlogs

# Quiet, useful default output. ``-ra`` summarises non-passing results
# at the end without overwhelming local runs.
addopts = -ra --strict-markers --strict-config -n auto --dist=loadfile --max-worker-restart=2

# Only keep tmp dirs from failed sessions, capped at the last 3.
# Without this pytest accumulates ``pytest-of-$user/`` directories under
# /tmp and old runs occasionally choke on stale entries during cleanup.
tmp_path_retention_count = 3
tmp_path_retention_policy = failed
